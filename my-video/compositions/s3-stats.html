<template>
  <style>
    @font-face{font-family:"Cairo";font-weight:900;src:url("assets/fonts/cairo-arabic-900.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF;}
    @font-face{font-family:"Cairo";font-weight:900;src:url("assets/fonts/cairo-latin-900.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F;}
    *{margin:0;padding:0;box-sizing:border-box;}
    #root{position:absolute;inset:0;overflow:hidden;font-family:"Cairo",sans-serif;font-weight:900;direction:rtl;}
    .fill{position:absolute;inset:0;}
    #root{background:#e4002b;}
    #s3-row{position:absolute;left:200px;right:200px;top:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;}
    .s3-stat{padding:0 40px;display:flex;flex-direction:column;align-items:center;}
    #s3-b{border-right:10px solid #fff;}
    .s3-num{color:#fff;font-size:210px;line-height:1.05;direction:ltr;}
    .s3-lbl{color:#fff;font-size:90px;line-height:1.7;}
    #s3-wipe{background:#0b0b0b;transform-origin:left center;}
  </style>
  <div id="root" data-composition-id="s3-stats" data-width="1920" data-height="1080">
    <div id="s3-row" class="clip" data-start="0" data-duration="3">
      <div id="s3-a" class="s3-stat"><div id="s3-n1" class="s3-num">0</div><div class="s3-lbl">مطعم حول العالم</div></div>
      <div id="s3-b" class="s3-stat"><div id="s3-n2" class="s3-num">0</div><div class="s3-lbl">دولة</div></div>
    </div>
    <div id="s3-wipe" class="fill clip" data-start="0" data-duration="3"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const o = { a: 0, b: 0 };
    const f = (n) => Math.round(n).toLocaleString("en-US");
    tl.set("#s3-wipe", { scaleX: 0 }, 0);
    tl.fromTo("#s3-a", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 0.1);
    tl.fromTo("#s3-b", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 0.4);
    tl.fromTo(o, { a: 0 }, { a: 31000, duration: 1.3, ease: "power2.out", onUpdate: () => { document.getElementById("s3-n1").textContent = "+" + f(o.a); } }, 0.15);
    tl.fromTo(o, { b: 0 }, { b: 150, duration: 1.1, ease: "power2.out", onUpdate: () => { document.getElementById("s3-n2").textContent = f(o.b); } }, 0.45);
    tl.fromTo("#s3-wipe", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.inOut" }, 2.65);
    window.__timelines["s3-stats"] = tl;
  </script>
</template>
